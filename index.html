:root{
  /* brand vars are re-set per store by applyBrand() */
  --maroon:#530001;--maroon2:#3a0001;--maroon3:#7a1a1c;--cream:#FBF3E4;--ivory:#FDF8F0;--tan:#B08D57;--gold:#C8942A;
  --ink:#2b1a1a;--muted:#7a6a5f;--line:#e6d9c3;--surface:#ffffff;
  --g:#2F7D5B;--b:#3A6EA5;--o:#C26A1B;--r:#B3261E;
  --font:'VMSerif',Cambria,Caladea,Georgia,'Nirmala UI','Noto Sans Tamil',Latha,serif;
  --rad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--ivory);color:var(--ink);font-size:16px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--font);margin:0;color:var(--maroon);font-weight:700}
h1{font-size:27px}h2{font-size:21px}h3{font-size:18px}h4{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
code{font-family:Consolas,monospace;background:#0000000d;padding:0 4px;border-radius:4px;font-size:.9em}
.muted{color:var(--muted)}.small{font-size:13.5px}.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}
.hide{display:none!important}
.mt{margin-top:14px}.mt2{margin-top:24px}.mb{margin-bottom:14px}

/* ---------- shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--maroon);color:#fff;display:flex;align-items:center;gap:10px;padding:9px 16px;position:sticky;top:0;z-index:30;border-bottom:3px solid var(--gold)}
.logo{width:42px;height:42px;border-radius:10px;display:block;object-fit:contain;flex:none}
.logo.ini{display:grid;place-items:center;background:var(--gold);color:var(--maroon2);font-weight:700;font-size:16px}
.top .ttl{font-size:19px;line-height:1.1;font-weight:700}
.top .sub{font-size:12px;color:#ffffffbb;letter-spacing:.4px;text-transform:uppercase}
.chip-draft{background:var(--gold);color:var(--maroon2);font-weight:700;font-size:10.5px;padding:2px 7px;border-radius:99px;letter-spacing:.5px;vertical-align:middle}
.user{display:flex;align-items:center;gap:8px;font-size:13.5px}
.user .av{width:32px;height:32px;border-radius:50%;background:var(--cream);color:var(--maroon);display:grid;place-items:center;font-weight:700}
.tb-btn{background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:9px;padding:6px 10px;font-size:13px;min-height:34px}
.tb-btn:hover{background:#ffffff1f}
.store-sel{background:#ffffff1f;color:#fff;border:1px solid #ffffff55;border-radius:9px;padding:6px 8px;font-size:13.5px;max-width:190px;min-height:34px}
.store-sel option{color:#2b1a1a}
.layout{display:flex;flex:1;min-height:0}
.side{width:230px;background:var(--maroon2);color:#f3e3c3;padding:14px 10px;flex:none;position:sticky;top:68px;align-self:flex-start;height:calc(100vh - 68px);overflow:auto;display:flex;flex-direction:column}
.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:inherit;text-decoration:none;cursor:pointer;margin-bottom:3px;transition:background .15s}
.side a .ph{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--gold);display:block;line-height:1}
.side a .nm{display:block;font-size:15px}
.side a.on{background:var(--maroon);box-shadow:inset 3px 0 0 var(--gold)}
.side a:hover{background:#ffffff14}
.side .grp{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin:14px 12px 6px;opacity:.85}
.pw{margin-top:auto;padding:12px;background:#fff;border-radius:12px;text-align:center}
.pw .t{font-size:10.5px;letter-spacing:.8px;color:#8a7a6f;text-transform:uppercase}
.pw img{height:46px;object-fit:contain;display:block;margin:2px auto 0}
main{flex:1;min-width:0;padding:20px 22px 90px;max-width:1280px;margin:0 auto;width:100%}
main.grow-anim .bar .t i{animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar .t i{transform-origin:left}
main.grow-anim>*{animation:fadeup .35s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bnav{display:none}
@media(max-width:860px){
  .side{display:none}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--maroon2);z-index:30;border-top:2px solid var(--gold);padding-bottom:env(safe-area-inset-bottom);align-items:flex-end}
  .bnav a{flex:1;text-align:center;color:#ffffffbb;padding:7px 2px 6px;font-size:11px;cursor:pointer;min-height:54px}
  .bnav a b{display:block;font-size:20px;font-weight:400;line-height:1.15}
  .bnav a.on{color:#fff;background:var(--maroon)}
  .bnav a.fab{position:relative;background:transparent}
  .bnav a.fab b{width:52px;height:52px;margin:-26px auto 2px;border-radius:50%;background:var(--gold);color:var(--maroon2);display:grid;place-items:center;font-size:24px;box-shadow:0 4px 14px #0006;border:3px solid var(--maroon2)}
  .bnav a.fab.on{background:transparent;color:#fff}
  main{padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
  .top{padding:8px 10px;gap:8px}.top .sub,.user .nm,.chip-draft{display:none}
  .top .ttl{font-size:16px}
  .store-sel{max-width:132px}
  input,select,textarea{font-size:16px!important}
  h1{font-size:23px}
}

/* ---------- cards & basics ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:16px}
.card h3{margin-bottom:8px}
.grid{display:grid;gap:14px;align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1000px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3{grid-template-columns:1fr}.g5,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--maroon);background:var(--maroon);color:#fff;border-radius:10px;padding:9px 15px;font-weight:700;font-size:15px;text-decoration:none;min-height:40px;transition:transform .1s,background .15s}
.btn:hover{background:var(--maroon3)}.btn:active{transform:scale(.97)}
.btn.alt{background:#fff;color:var(--maroon)}.btn.alt:hover{background:var(--cream)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--maroon2)}
.btn.sm{padding:5px 11px;font-size:13.5px;border-radius:8px;min-height:32px}
.btn.dng{background:#fff;color:var(--r);border-color:#e3b1ad}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:#e1f0e8;color:#1d5a3f}.pill.soon{background:#fbe8d4;color:#8f4a0f}.pill.over{background:#f7dcd9;color:#8c1c15}.pill.none{background:#eee7da;color:#6b5d50}.pill.blue{background:#dfe9f5;color:#25507f}.pill.gold{background:#f6e8c8;color:#6e4e0b}
label.f{display:block;font-size:13.5px;font-weight:700;color:var(--maroon);margin-bottom:10px}
label.f span.h{font-weight:400;color:var(--muted)}
.inp,select.inp,textarea.inp{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid #d9c9aa;border-radius:10px;background:#fff;font-weight:400;color:var(--ink);min-height:40px}
.inp:focus{outline:2px solid var(--gold);outline-offset:0}
input[type=color].inp{padding:2px;height:42px;cursor:pointer}
textarea.inp{min-height:64px;resize:vertical}
table{border-collapse:collapse;width:100%}
th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f0e6d2;vertical-align:middle}
tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
@media(max-width:700px){
  .rt thead{display:none}
  .rt tr{display:block;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px 10px;background:#fff}
  .rt td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:5px 0;text-align:right}
  .rt td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;font-weight:700;text-align:left;flex:none}
  .rt td.nol::before{display:none}
}
.empty{text-align:center;padding:36px 14px;color:var(--muted)}
.empty .big{font-size:42px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead .ph-tag{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tan);font-weight:700}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;flex:none}
.tabs button.on{color:var(--maroon);border-bottom-color:var(--gold)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px;color:var(--muted);transition:all .15s;min-height:36px}
.chip.on{background:var(--maroon);border-color:var(--maroon);color:#fff}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login .l{background:radial-gradient(circle at 30% 20%,var(--maroon3) 0,var(--maroon) 45%,var(--maroon2) 100%);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login .l .big{width:112px;height:112px;border-radius:24px;box-shadow:0 8px 30px #0006}
.login .l h1{color:#fff;font-size:34px;margin-top:22px;line-height:1.15}
.login .l p{color:#ffffffcc;max-width:430px}
.login .steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.login .steps span{border:1px solid #ffffff66;color:#fff;border-radius:99px;padding:3px 11px;font-size:13px}
.login .r{display:grid;place-items:center;padding:28px;background:var(--cream);position:relative}
.login .lang{position:absolute;top:14px;right:14px}
.login form{width:100%;max-width:370px}
.login .pwr{display:flex;align-items:center;gap:10px;margin-top:20px;font-size:11.5px;color:#ffffffaa;letter-spacing:.8px;text-transform:uppercase}
.login .pwr .wb{background:#fff;border-radius:10px;padding:4px 10px}.login .pwr img{height:34px;display:block}
.demo{margin-top:16px;background:#fff;border:1px dashed var(--tan);border-radius:10px;padding:10px 12px;font-size:13.5px}
@media(max-width:820px){.login{grid-template-columns:1fr}.login .l{padding:24px;min-height:300px}.login .l h1{font-size:25px}.login .l .big{width:80px;height:80px}}

/* ---------- KPI, bars, heatmap ---------- */
.kpi{padding:14px 15px;display:flex;flex-direction:column;gap:3px;border-top:4px solid var(--gold)}
.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700}
.kpi .val{font-size:34px;color:var(--maroon);line-height:1.05;font-weight:700}
.kpi .val small{font-size:15px;color:var(--muted);font-weight:400}
.kpi .foot{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.delta.up{color:var(--g);font-weight:700}.delta.dn{color:var(--r);font-weight:700}
.bar{display:grid;grid-template-columns:175px 1fr 40px;gap:10px;align-items:center;margin:7px 0;font-size:14px;cursor:default}
.bar[data-act]{cursor:pointer}.bar[data-act]:hover .lb{text-decoration:underline}
.bar .t{height:11px;background:#f1e7d3;border-radius:99px;position:relative;overflow:hidden}
.bar .t i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bar .t u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--maroon);opacity:.55}
.bar .n{font-weight:700;text-align:right}
.bar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:700px){.bar{grid-template-columns:105px 1fr 34px;gap:7px;font-size:13px}}
.hm th,.hm td{text-align:center;padding:6px 6px;font-size:13px}
.hm td:first-child,.hm th:first-child{text-align:left;white-space:nowrap}
.hm tr[data-act]{cursor:pointer}.hm tr[data-act]:hover td{background:var(--cream)}
.hm .c{border-radius:8px;font-weight:700;padding:5px 0;min-width:44px;display:block}
.insight{border-left:4px solid var(--gold);background:var(--cream);border-radius:0 12px 12px 0;padding:11px 14px;margin-bottom:10px}
.insight b.k{display:inline-block;min-width:74px;font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--tan)}
.insight div{margin:2px 0}
.cbflow{display:flex;margin-bottom:16px;overflow-x:auto}
.cbflow div{flex:1;min-width:128px;background:var(--cream);padding:8px 12px;border:1px solid var(--line);font-size:12.5px}
.cbflow div b{display:block;color:var(--maroon);font-size:15px}
.cbflow div.on{background:var(--maroon);color:#ffffffcc;border-color:var(--maroon)}.cbflow div.on b{color:#fff}
.cbflow div:first-child{border-radius:12px 0 0 12px}.cbflow div:last-child{border-radius:0 12px 12px 0}
.gauge-wrap{display:flex;align-items:center;gap:14px}
.gauge-arc{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.storebadge{display:flex;align-items:center;gap:10px}
.storebadge .logo{width:46px;height:46px}

/* ---------- audit ---------- */
.theme-card{display:flex;gap:14px;align-items:stretch;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;background:#fff}
.theme-card .im{width:150px;flex:none;background-size:cover;background-position:center;min-height:110px;display:flex;align-items:flex-end}
.theme-card .im span{background:#000a;color:#fff;font-size:11px;padding:2px 7px;border-radius:0 8px 0 0}
.theme-card .bd{padding:12px 14px 12px 0;flex:1}
@media(max-width:560px){.theme-card{flex-direction:column;gap:0}.theme-card .im{width:100%;min-height:120px}.theme-card .bd{padding:10px 14px 14px}}
.sw{display:inline-block;width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cdbb97;margin-right:-5px;vertical-align:middle}
.secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sec{border:1px solid var(--line);background:#fff;border-radius:var(--rad);padding:13px;cursor:pointer;display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;transition:transform .12s,box-shadow .15s}
.sec:hover{border-color:var(--gold);box-shadow:0 2px 10px #0001}.sec:active{transform:scale(.98)}
.sec .ic{font-size:27px}
.prog{height:7px;background:#f1e7d3;border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold);transition:width .4s}
.prog.done i{background:var(--g)}
.q{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:13px 14px;margin-bottom:12px;transition:border-color .2s,box-shadow .2s}
.q.miss{border-color:#e6a49d;background:#fffafa}
.q.ans{border-left:5px solid var(--g)}
.q.pulse{box-shadow:0 0 0 3px var(--gold)}
.q .qh{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.q .qt{font-weight:700}
.q .cat{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--tan);font-weight:700;display:block}
.scale{display:grid;grid-template-columns:repeat(5,1fr) 56px;gap:6px}
.scale button{border:1.5px solid #d9c9aa;background:#fff;border-radius:11px;padding:8px 0 6px;font-weight:700;font-size:19px;line-height:1.1;min-height:52px;transition:transform .12s,background .15s}
.scale button:active{transform:scale(.92)}
.scale button small{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-top:1px}
.scale button.on{color:#fff;border-color:transparent;transform:scale(1.04)}.scale button.on small{color:#ffffffdd}
.scale button.s1.on{background:var(--r)}.scale button.s2.on{background:var(--o)}.scale button.s3.on{background:#a8801a}.scale button.s4.on{background:#4c8a3d}.scale button.s5.on{background:var(--g)}
.scale button.na{font-size:13px}.scale button.na.on{background:#6b5d50}
@media(max-width:420px){.scale{gap:4px;grid-template-columns:repeat(5,1fr) 46px}.scale button small{font-size:8.5px}}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.thumb{position:relative;width:66px;height:66px;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb b{position:absolute;top:2px;right:2px;background:#000a;color:#fff;width:22px;height:22px;border-radius:50%;text-align:center;line-height:21px;font-size:14px;cursor:pointer}
.pbtn{display:inline-flex;gap:6px;align-items:center;border:1.5px dashed var(--tan);color:var(--maroon);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;background:var(--ivory);cursor:pointer;min-height:40px}
.pbtn input{display:none}
.req{background:#f7dcd9;color:#8c1c15;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap}
.opt{background:#eee7da;color:#6b5d50;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap}
.stickybar{position:sticky;top:67px;z-index:20;background:var(--ivory);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
@media(max-width:860px){.stickybar{top:58px}}
.rubric{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:12.5px}
.rubric div{background:var(--cream);border-radius:10px;padding:7px 8px}.rubric b{display:block;color:var(--maroon)}
@media(max-width:700px){.rubric{grid-template-columns:1fr}.cbflow div{min-width:0;padding:6px 8px;font-size:11px}.cbflow div b{font-size:13px}.cbflow .d{display:none}}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.gal figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:zoom-in}
.gal img{width:100%;height:90px;object-fit:cover;display:block}.gal figcaption{font-size:11px;padding:4px 6px;color:var(--muted);line-height:1.2}
.fab-next{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;background:var(--gold);color:var(--maroon2);border:0;border-radius:99px;padding:11px 16px;font-weight:700;box-shadow:0 4px 16px #0004;font-size:15px}
@media(min-width:861px){.fab-next{bottom:24px;right:24px}}
.sticky-actions{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--ivory) 30%);padding:18px 0 4px;display:flex;gap:10px;flex-wrap:wrap}
@media(min-width:861px){.sticky-actions{bottom:0}}

/* ---------- stores ---------- */
.storecard{display:flex;flex-direction:column;gap:10px}
.storecard .hd{display:flex;gap:12px;align-items:center}
.storecard .logo{width:54px;height:54px}
.brandprev{border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.brandprev .bp-top{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff;border-bottom:3px solid}
.brandprev .bp-body{padding:12px;display:flex;gap:10px;align-items:center}

/* ---------- modal / toast / tip ---------- */
#modal{position:fixed;inset:0;background:#2b0a0a99;z-index:80;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:20px;border-top:5px solid var(--gold);animation:fadeup .25s ease}
.mbox.wide{max-width:900px}
.mbox h3{margin-bottom:14px}
@media(max-width:700px){#modal{align-items:flex-end;padding:0}.mbox{border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:sheet .25s ease}}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheetbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--cream);border-radius:12px;padding:13px 14px;margin-bottom:8px;font-weight:700;color:var(--maroon);font-size:16px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--maroon);color:#fff;padding:10px 18px;border-radius:99px;z-index:90;display:none;font-size:14.5px;box-shadow:0 6px 20px #0004;max-width:92vw;text-align:center}
#toast.err{background:var(--r)}
#tip{position:fixed;z-index:95;background:#2b1a1a;color:#fff;font-size:12.5px;padding:6px 9px;border-radius:8px;pointer-events:none;display:none;max-width:260px}
svg text{font-family:var(--font)}
.lightbox img{max-width:100%;max-height:78vh;display:block;margin:auto;border-radius:10px}
@media print{
  .top,.side,.bnav,.no-print,.sticky-actions,#toast,.fab-next{display:none!important}
  body{background:#fff}main{padding:0;max-width:none}
  .card{break-inside:avoid}
}
@media(max-width:860px){.no-mob{display:none}}
</style>

/* ---------- display freshness ---------- */
function freshScore(ratio){return ratio<=1?5:ratio<=1.25?4:ratio<=1.5?3:ratio<=2?2:1}
function freshInfo(freq,last,ref){
  if(!last)return{state:'none',days:null,score:null,next:null,left:null};
  const days=Math.max(0,dayDiff(last,ref)),left=freq-days;
  const state=days>freq?'over':left<=Math.ceil(freq*S.set.dueSoonPct/100)?'soon':'ok';
  return{state,days,score:freshScore(days/freq),next:addDays(last,freq),left}}

/* ---------- scoring (5-point, weighted) ---------- */
function scoreSection(a,secId){
  const sec=secById(secId);let num=0,den=0;const cats={};
  const add=(cat,v,w)=>{num+=v*w;den+=w;(cats[cat]=cats[cat]||{n:0,d:0});cats[cat].n+=v*w;cats[cat].d+=w};
  const R=(a.resp||{})[secId]||{};
  for(const qid in R){const q=qById(qid),r=R[qid];if(!q||!r||!(r.s>0))continue;add(q.cat,r.s,q.w)}
  const chg=(a.chg||{})[secId];
  if(chg&&sec){const fi=freshInfo(sec.freq,chg,a.date);if(fi.score)add('Freshness',fi.score,S.set.freshW)}
  return{score:den?num/den:null,num,den,cats}}
function analyze(a){
  const scope=a.scope||Object.keys(a.resp||{});
  let N=0,D=0;const bySec={},cat={},floor={};
  for(const sid of scope){
    const sc=scoreSection(a,sid);bySec[sid]=sc;N+=sc.num;D+=sc.den;
    for(const c in sc.cats){cat[c]=cat[c]||{n:0,d:0};cat[c].n+=sc.cats[c].n;cat[c].d+=sc.cats[c].d}
    const sec=secById(sid);if(sec&&sc.den){floor[sec.floor]=floor[sec.floor]||{n:0,d:0};floor[sec.floor].n+=sc.num;floor[sec.floor].d+=sc.den}}
  const byCat={};for(const c in cat)byCat[c]=cat[c].d?cat[c].n/cat[c].d:null;
  const byFloor={};for(const f in floor)byFloor[f]=floor[f].n/floor[f].d;
  let req=0,have=0;
  for(const sid of scope){
    if(S.set.requireSnap){req++;if(photosOf(a.id,sid,'SNAP').length)have++}
    const R=(a.resp||{})[sid]||{};
    for(const qid in R){const q=qById(qid);if(q&&q.photo==='Y'&&R[qid].s!==0){req++;if(photosOf(a.id,sid,qid).length)have++}}}
  return{overall:D?N/D:null,bySec,byCat,byFloor,photoReq:req,photoHave:have,photoPct:req?have/req:null}}
const photosOf=(aid,sid,qid)=>S.photos.filter(p=>p.audit===aid&&p.sec===sid&&p.q===qid);
function submitted(stId=curStore().id){return sortBy(S.audits.filter(a=>a.status==='Submitted'&&(stId==='all'||a.store===stId)),a=>a.date+(a.time||''))}
function secProgress(a,sid){
  const sec=secById(sid),qs=questionsFor(sec.type),R=(a.resp||{})[sid]||{};
  let done=0,missPh=0;
  qs.forEach(q=>{const r=R[q.id];if(r&&r.s!==undefined)done++;if(q.photo==='Y'&&r&&r.s>0&&!photosOf(a.id,sid,q.id).length)missPh++});
  const needChg=!(a.chg||{})[sid],needSnap=S.set.requireSnap&&!photosOf(a.id,sid,'SNAP').length,total=qs.length;
  return{total,done,missPh,needChg,needSnap,complete:done===total&&!missPh&&!needChg&&!needSnap,started:done>0||!!(a.chg||{})[sid]}}

function presetRange(p){

  if(p==='month')return[fmtD(new Date(y,m,1)),today()];
  if(p==='last')return[fmtD(new Date(y,m-1,1)),fmtD(new Date(y,m,0))];

function repAudits(){

  const st=R.store==='cur'?curStore().id:R.store;if(st!=='all')l=l.filter(a=>a.store===st);

  return sortBy(l,a=>a.date+(a.time||''))}
function aggregate(list){
  const items=list.map(a=>({a,an:analyze(a)})).filter(x=>x.an.overall!=null);
  const mean=arr=>arr.length?arr.reduce((x,y)=>x+y,0)/arr.length:null;
  const cat={},sec={};let req=0,have=0;
  items.forEach(({an})=>{for(const c in an.byCat)if(an.byCat[c]!=null)(cat[c]=cat[c]||[]).push(an.byCat[c]);
    for(const k in an.bySec)if(an.bySec[k].score!=null)(sec[k]=sec[k]||[]).push(an.bySec[k].score);req+=an.photoReq;have+=an.photoHave});
  const byCat={},bySec={};for(const c in cat)byCat[c]=mean(cat[c]);for(const k in sec)bySec[k]=mean(sec[k]);
  const sc=items.map(x=>x.an.overall);
  return{n:items.length,items,avg:mean(sc),first:sc[0],last:sc[sc.length-1],best:items.length?items.reduce((x,y)=>y.an.overall>x.an.overall?y:x):null,worst:items.length?items.reduce((x,y)=>y.an.overall<x.an.overall?y:x):null,byCat,bySec,photoPct:req?have/req:null}}

    const t0=performance.now(),step=n=>{const k=Math.min(1,(n-t0)/800),e=1-Math.pow(1-k,3);el.textContent=(to*e).toFixed(dec);if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step)});
  U.anim=false;
}

/* ---------- shared visual helpers ---------- */
function gauge(v,size=124){
  const r=size/2-9,C=2*Math.PI*r,b=band(v),off=C*(1-(v==null?0:v/5)),c=size/2;
  return`<svg class="gauge" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${r2(v)} / 5">
   <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#efe5d0" stroke-width="10"/>
   <circle class="gauge-arc" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${b.color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" style="stroke-dashoffset:${C}" data-to="${off}" transform="rotate(-90 ${c} ${c})"/>
   <text x="${c}" y="${c+4}" text-anchor="middle" font-size="${size*.24}" font-weight="700" fill="#2b1a1a" ${v!=null?`data-count="${v}" data-dec="2"`:''}>${r2(v)}</text>
   <text x="${c}" y="${c+size*.2}" text-anchor="middle" font-size="${size*.11}" fill="#7a6a5f">/ 5</text></svg>`}
function cell(v,strong){if(v==null)return'<span class="c" style="color:#b9ab9a">–</span>';const b=band(v);return`<span class="c" data-tip="${esc(bandName(b))}" style="background:${b.color}22;color:#2b1a1a;${strong?'border:1.5px solid '+b.color:''}">${r1(v)}</span>`}
function barRow(label,v,tgt,drill){const b=band(v),pct=v==null?0:Math.max(0,Math.min(100,v/5*100));
  return`<div class="bar" ${drill||''} data-tip="${esc(label)}: ${r2(v)} / 5 · ${esc(bandName(b))}"><span class="lb">${esc(label)}</span><span class="t"><i style="width:${pct}%;background:${b.color}"></i><u style="left:${tgt/5*100}%"></u></span><span class="n">${r1(v)}</span></div>`}
function trendChart(list){
  const pts=list.slice(-10).map(a=>({a,v:analyze(a).overall})).filter(p=>p.v!=null);
  if(pts.length<2)return`<div class="empty small">${LANG==='ta'?'இரண்டு தணிக்கைகளுக்குப் பிறகு போக்கு தெரியும்.':'Trend appears after two submitted audits.'}</div>`;
  const W=560,H=210,L=32,R=14,T=14,B=34,x=i=>L+(W-L-R)*(i/(pts.length-1)),y=v=>T+(H-T-B)*(1-(v-1)/4),tg=S.set.target;
  const lbl=p=>{const d=P(p.a.date);return d.getDate()+' '+mShort(d.getMonth())};
  let g='';for(let v=1;v<=5;v++)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#eadfca"/><text x="${L-7}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#7a6a5f">${v}</text>`;
  const path=pts.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p.v)).join(' '),last=pts[pts.length-1];
  const every=Math.ceil(pts.length/6);
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${t('Score trend')}">${g}
   <line x1="${L}" x2="${W-R}" y1="${y(tg)}" y2="${y(tg)}" stroke="#530001" stroke-dasharray="5 4" stroke-width="1.2" opacity=".6"/><text x="${L+4}" y="${y(tg)-5}" font-size="10.5" fill="#530001">${t('Target')} ${tg}</text>
   <path d="${path}" fill="none" stroke="var(--maroon)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map((p,i)=>`<g data-tip="${lbl(p)} ${P(p.a.date).getFullYear()} · ${r2(p.v)} / 5 · ${esc(bandName(band(p.v)))}"><circle cx="${x(i)}" cy="${y(p.v)}" r="15" fill="transparent"/><circle cx="${x(i)}" cy="${y(p.v)}" r="5" fill="${band(p.v).color}" stroke="#fff" stroke-width="2"/></g>${i%every===0||i===pts.length-1?`<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#7a6a5f">${lbl(p)}</text>`:''}`).join('')}
   <text x="${x(pts.length-1)}" y="${y(last.v)+20}" text-anchor="end" font-size="12.5" font-weight="700" fill="#2b1a1a">${r2(last.v)}</text></svg>`}
function insightsHtml(a,an,pan,over){
  const out=[],cats=Object.keys(an.byCat).filter(c=>an.byCat[c]!=null).sort((x,y)=>an.byCat[x]-an.byCat[y]),th=themeById(a.themeId);
  if(cats.length){const c=cats[0];out.push([`${c} is the weakest dimension at ${r1(an.byCat[c])}/5.`,an.byCat[c]<S.set.target?`It sits ${r1(S.set.target-an.byCat[c])} below the ${S.set.target} target and drags the overall score.`:'Even the weakest dimension meets target – protect the gains.',CAT_ACTION[c]||'Review the lowest-scoring questions with the section owner and agree a fix date.'])}
  const secs=Object.keys(an.bySec).filter(k=>an.bySec[k].score!=null).sort((x,y)=>an.bySec[x].score-an.bySec[y].score);
  if(secs.length){const s=secById(secs[0]);if(s)out.push([`${s.name} (${s.floor}) is the lowest section at ${r1(an.bySec[secs[0]].score)}/5.`,'Customers meet this display at the same moment staff do – gaps here are visible, not hidden.','Run a 15-minute on-the-spot reset with the section owner and re-photograph it.'])}
  if(over)out.push([`${over} section${over>1?'s are':' is'} overdue for a display change.`,'Stale displays weaken the seasonal story and repeat-visit appeal.',CAT_ACTION.Freshness]);
  if(an.byCat.Theme!=null&&an.overall!=null&&an.byCat.Theme<an.overall-.25)out.push([`Theme adherence (${r1(an.byCat.Theme)}) trails the overall score.`,`Sections are not fully dressed to ${th?th.name:'the monthly theme'}.`,CAT_ACTION.Theme]);
  if(an.photoPct!=null&&an.photoPct<.9)out.push([`Photo evidence is ${Math.round(an.photoPct*100)}%.`,'Without images, scores cannot be verified or coached.','Make the required photos a gate before submission.']);
  if(pan&&an.overall!=null&&pan.overall!=null){const d=an.overall-pan.overall;out.push([`Overall score ${d>=0?'improved':'slipped'} by ${Math.abs(d).toFixed(2)} vs the previous audit.`,d>=0?'The last cycle’s actions are working.':'Check whether last cycle’s actions were closed.','Review the Actions list before the next audit.'])}
  return out.slice(0,4).map(i=>`<div class="insight"><div><b class="k">${t('Finding')}</b>${esc(i[0])}</div><div><b class="k">${t('So what')}</b>${esc(i[1])}</div><div><b class="k">${t('Now what')}</b>${esc(i[2])}</div></div>`).join('')||'<span class="muted">Not enough data.</span>'}

function questionCard(a,sec,q,r){

/* ---------- Reports (Review) with date range ---------- */
function viewReports(){
  const R=U.rep,list=repAudits(),ag=aggregate(list),stores=myStores();
  const multi=(R.store==='all'||stores.length>1&&R.store==='all');
  const bb=band(ag.avg),chg=ag.n>1?ag.last-ag.first:null;
  const cats=Object.keys(ag.byCat).sort((x,y)=>ag.byCat[x]-ag.byCat[y]),secs=sortBy(Object.keys(ag.bySec),k=>ag.bySec[k]);
  const tile=(lbl,val,foot,color)=>`<div class="card kpi" style="border-top-color:${color||'var(--gold)'}"><div class="lbl">${t(lbl)}</div><div class="val">${val}</div><div class="foot">${foot||''}</div></div>`;
  const rangeLbl=R.from||R.to?`${R.from?prettyD(R.from):'…'} → ${R.to?prettyD(R.to):'…'}`:t('All time');
  return head('Review',t('Audit history'),`<button class="btn alt sm" onclick="window.print()">${t('🖨️ Print / PDF')}</button><button class="btn alt sm" data-act="exportCSV" data-v="audits">${t('⬇ Audits CSV')}</button><button class="btn alt sm" data-act="exportCSV" data-v="responses">${t('⬇ Responses CSV')}</button>`)+`
  <div class="card no-print"><h3>${t('Date range')}</h3>
   <div class="chips mb">${[['month','This month'],['last','Last month'],['q3','Last 3 months'],['ytd','This year'],['all','All time']].map(x=>`<button class="chip ${R.preset===x[0]?'on':''}" data-act="preset" data-v="${x[0]}">${t(x[1])}</button>`).join('')}${R.preset==='custom'?`<button class="chip on">${t('Custom')}</button>`:''}</div>
   <div class="grid g4"><label class="f">${t('From')}<input class="inp" type="date" value="${R.from}" data-change="repFrom"></label>
    <label class="f">${t('To')}<input class="inp" type="date" value="${R.to}" data-change="repTo"></label>
    <label class="f">${t('Store')}<select class="inp" data-change="repStore"><option value="cur" ${R.store==='cur'?'selected':''}>${t('This store')} (${esc(curStore().short||curStore().name)})</option>${stores.length>1?`<option value="all" ${R.store==='all'?'selected':''}>${t('All stores')}</option>`:''}${stores.length>1?stores.filter(s=>s.id!==curStore().id).map(s=>`<option value="${s.id}" ${R.store===s.id?'selected':''}>${esc(s.short||s.name)}</option>`).join(''):''}</select></label>
    <label class="f">${t('Status')}<select class="inp" data-change="repStatus"><option value="Submitted" ${R.status==='Submitted'?'selected':''}>${t('Submitted')}</option><option value="Draft" ${R.status==='Draft'?'selected':''}>${t('Draft')}</option><option value="all" ${R.status==='all'?'selected':''}>${t('Any status')}</option></select></label></div></div>
  <div class="row between mt mb"><h3 style="margin:0">${t('Range summary')} <span class="muted small">· ${rangeLbl}</span></h3></div>
  ${ag.n?`<div class="grid g5">
   ${tile('Audits',ag.n,'')}
   ${tile('Average score',`${r2(ag.avg)}<small> / 5</small>`,`<span class="pill" style="background:${bb.color};color:#fff">${esc(bandName(bb))}</span>`,bb.color)}
   ${tile('Change',chg==null?'—':`<span class="delta ${chg>=0?'up':'dn'}">${chg>=0?'▲':'▼'} ${Math.abs(chg).toFixed(2)}</span>`,chg==null?'':`${r2(ag.first)} → ${r2(ag.last)}`)}
   ${tile('Best',r2(ag.best.an.overall),prettyD(ag.best.a.date),'var(--g)')}
   ${tile('Lowest',r2(ag.worst.an.overall),prettyD(ag.worst.a.date),'var(--r)')}</div>
  <div class="grid g2 mt"><div class="card"><h3>${t('Score trend')}</h3>${trendChart(ag.items.map(x=>x.a))}</div>
   <div class="card"><h3>${t('Average by dimension')}</h3>${cats.map(c=>barRow(catn(c),ag.byCat[c],S.set.target)).join('')}${ag.photoPct!=null?`<div class="small muted mt">${t('Photo evidence')}: <b>${Math.round(ag.photoPct*100)}%</b></div>`:''}</div></div>
  <div class="card mt"><h3>${t('Average by section')}</h3><div class="grid g2" style="gap:0 28px">${secs.map(k=>{const s=secById(k);return s?barRow(`${s.floor} · ${sn(s)}${R.store==='all'?' ('+(storeOf(s.store).short||'')+')':''}`,ag.bySec[k],S.set.target,`data-act="drillLatest" data-sid="${k}"`):''}).join('')}</div></div>`:''}
  <div class="card mt">${list.length?`<div class="tscroll"><table class="rt"><thead><tr><th>${t('Date')}</th>${R.store==='all'?`<th>${t('Store')}</th>`:''}<th>${t('Auditor')}</th><th>${t('Theme')}</th><th>${t('Score /5')}</th><th>${t('Band')}</th><th>${t('Photos')}</th><th>${t('Status')}</th><th></th></tr></thead><tbody>${[...list].reverse().map(a=>{const an=analyze(a),b=band(an.overall);return`<tr><td data-l="${t('Date')}">${prettyD(a.date)}<div class="tiny muted">${a.time||''}</div></td>${R.store==='all'?`<td data-l="${t('Store')}">${esc(storeOf(a.store).short||'')}</td>`:''}<td data-l="${t('Auditor')}">${esc(a.auditor)}</td><td data-l="${t('Theme')}">${esc(thn(themeById(a.themeId)))}</td><td data-l="${t('Score /5')}"><b>${r2(an.overall)}</b></td><td data-l="${t('Band')}"><span class="pill" style="background:${b.color};color:#fff">${esc(bandName(b))}</span></td><td data-l="${t('Photos')}">${an.photoPct==null?'—':Math.round(an.photoPct*100)+'%'}</td><td data-l="${t('Status')}"><span class="pill ${a.status==='Submitted'?'ok':'soon'}">${t(a.status)}</span></td>
   <td class="nol" style="white-space:nowrap"><button class="btn sm alt" data-act="${a.status==='Draft'?'openAudit':'openSummary'}" data-id="${a.id}">${a.status==='Draft'?t('Continue'):t('View')}</button>${U.user.role==='Owner'?` <button class="btn sm dng" data-act="delAudit" data-id="${a.id}">${t('Delete')}</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">🗂️</div>${t('No audits in this range.')}</div>`}</div>`;
}

/* ---------- Configure ---------- */
function viewConfig(){
  const tabs=[['stores','Stores'],['sections','Floors & Sections'],['themes','Themes'],['checklist','Checklist'],['scoring','Scoring'],['users','Users'],['data','Data']],tb=U.tab;
  return head('Set up',t('Configure'))+`<div class="tabs">${tabs.map(x=>`<button class="${tb===x[0]?'on':''}" data-act="tab" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`+({stores:cfgStores,sections:cfgSections,themes:cfgThemes,checklist:cfgChecklist,scoring:cfgScoring,users:cfgUsers,data:cfgData}[tb])();
}

   ${qs.map(q=>`<tr style="${q.active?'':'opacity:.5'}"><td style="white-space:nowrap"><button class="btn sm alt" style="padding:1px 8px;min-height:28px" data-act="moveQ" data-id="${q.id}" data-v="-1">↑</button><button class="btn sm alt" style="padding:1px 8px;min-height:28px" data-act="moveQ" data-id="${q.id}" data-v="1">↓</button></td>

}
function cfgScoring(){

   <div class="grid g3"><label class="f">Target score<input class="inp" type="number" step="0.1" min="1" max="5" name="target" value="${s.target}"></label>
   <label class="f">Freshness weight<span class="h"> (as a question weight)</span><input class="inp" type="number" step="1" min="0" max="5" name="freshW" value="${s.freshW}"></label>
   <label class="f">Raise action when score ≤<input class="inp" type="number" step="1" min="1" max="4" name="actionMax" value="${s.actionMax}"></label>

   <p class="muted small">Score = Σ(score × weight) ÷ Σ(weight) across answered questions (N/A excluded). Display freshness = 5 when changed within frequency, 4 ≤1.25×, 3 ≤1.5×, 2 ≤2×, else 1.</p>

/* ====================================================================
   MODALS / FORMS
   ==================================================================== */
function modal(title,html,onSave,wide){
  const m=$('#modal');m.innerHTML=`<div class="mbox ${wide?'wide':''}"><h3>${title}</h3><form id="mform" onsubmit="return false">${html}
   <div class="row mt2" style="justify-content:flex-end">${onSave?`<button type="button" class="btn alt" data-act="closeModal">${t('Cancel')}</button><button type="button" class="btn" data-act="saveModal">${t('Save')}</button>`:`<button type="button" class="btn" data-act="closeModal">${t('Close')}</button>`}</div></form></div>`;
  m.classList.add('on');modal.save=onSave;
}
const closeModal=()=>{$('#modal').classList.remove('on');$('#modal').innerHTML=''};
function fd(){const f=$('#mform'),o={};if(!f)return o;new FormData(f).forEach((v,k)=>{o[k]=v});return o}
const fld=(l,n,v,o={})=>{const ty=o.type||'text';
  if(ty==='select')return`<label class="f">${l}<select class="inp" name="${n}">${o.opts.map(x=>{const [val,lab]=Array.isArray(x)?x:[x,x];return`<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select></label>`;
  if(ty==='area')return`<label class="f">${l}<textarea class="inp" name="${n}">${esc(v)}</textarea></label>`;
  return`<label class="f">${l}${o.h?` <span class="h">${o.h}</span>`:''}<input class="inp" type="${ty}" name="${n}" value="${esc(v)}" ${o.attr||''} ${o.list?`list="${o.list}"`:''}></label>`};
const bad=m=>{toast(m,true);return false};

const MODALS={
  addFloor(){modal('Add floor to '+esc(curStore().name),fld('Code <span class="h">(e.g. GF, FF, SF)</span>','code','')+fld('Floor name','name','')+fld('Sort order','sort',myFloors().length+1,{type:'number'}),()=>{const o=fd();o.code=o.code.trim().toUpperCase();if(!o.code||!o.name.trim())return bad('Code and name are required');if(floorOf(o.code,curStore().id))return bad('Floor code already exists in this store');S.floors.push({store:curStore().id,code:o.code,name:o.name.trim(),sort:+o.sort||1,active:true});log('floor_added',o.code);return true})},
  editFloor(id){const f=floorOf(id,curStore().id);modal('Edit floor',fld('Floor name','name',f.name)+fld('Sort order','sort',f.sort,{type:'number'})+fld('Active','active',f.active?'1':'0',{type:'select',opts:[['1','Yes'],['0','No']]}),()=>{const o=fd();if(!o.name.trim())return bad('Name is required');f.name=o.name.trim();f.sort=+o.sort||1;f.active=o.active==='1';return true})},
  addSection(code){secForm({floor:code,type:'Counter',name:'',nameTa:'',icon:'💍',sort:S.sections.filter(s=>s.store===curStore().id).length+1,freq:30,active:true},true)},
  editSection(id){secForm(secById(id),false)},
  addTheme(){themeForm({month:new Date().getMonth()+1,year:new Date().getFullYear(),name:'',nameTa:'',desc:'',palette:'#530001,#c8942a,#fdf8f0',props:'',url:'',active:true},true)},
  editTheme(id){themeForm(themeById(id),false)},
  addQ(){qForm({type:'Counter',cat:'Appearance',text:'',ta:'',w:2,photo:'N',sort:99,active:true},true)},
  editQ(id){qForm(qById(id),false)},
  addUser(){userForm({name:'',username:'',role:'Auditor',active:true,stores:[]},true)},
  editUser(id){userForm(userById(id),false)},
  addStore(){storeForm({name:'',short:'',code:'',city:'',area:'',state:'',pin:'',phone:'',manager:'',logo:'',logoBg:'white',primary:'#530001',accent:'#C8942A',tint:'#FBF3E4',active:true},true)},
  editStore(id){storeForm(S.stores.find(s=>s.id===id),false)},
};
function storeForm(s,isNew){
  modal(isNew?'Add store':'Edit store',
   fld('Store name','name',s.name)+`<div class="grid g2">`+fld('Short name <span class="h">(header &amp; reports)</span>','short',s.short)+fld('Store code','code',s.code)+`</div>`+
   `<h4>Place</h4><div class="grid g2">`+fld('Area / street','area',s.area)+fld('City','city',s.city)+fld('State','state',s.state)+fld('Pincode','pin',s.pin)+`</div><div class="grid g2">`+fld('Store manager','manager',s.manager)+fld('Phone','phone',s.phone)+`</div>`+
   `<h4>Brand</h4><label class="f">Logo <span class="h">(PNG/JPG – square works best)</span><input class="inp" type="file" accept="image/*" id="stLogo"></label>`+
   fld('Logo background','logoBg',s.logoBg,{type:'select',opts:[['primary','Brand colour'],['white','White'],['none','Transparent']]})+
   `<div class="grid g3">`+fld('Primary colour','primary',s.primary,{type:'color'})+fld('Accent colour','accent',s.accent,{type:'color'})+fld('Background tint','tint',s.tint,{type:'color'})+`</div>`+

/* drill-down: one section of one audit */
function drill(aid,sid){
  const a=auditById(aid),s=secById(sid);if(!a||!s)return;
  const R=(a.resp||{})[sid]||{},sc=scoreSection(a,sid),b=band(sc.score),fi=freshInfo(s.freq,(a.chg||{})[sid],a.date);
  const rows=Object.keys(R).map(id=>({q:qById(id),r:R[id]})).filter(x=>x.q).sort((x,y)=>(x.r.s||9)-(y.r.s||9));
  const chip=v=>v===0?'<span class="pill none">N/A</span>':`<span class="pill" style="background:${band(v).color};color:#fff;min-width:30px;justify-content:center">${v}</span>`;
  modal(`${s.icon} ${esc(sn(s))} · ${prettyD(a.date)}`,`<div class="row mb"><span class="pill" style="background:${b.color};color:#fff;font-size:15px">${r2(sc.score)} / 5 · ${esc(bandName(b))}</span>${freshPill(fi)}${fi.days!=null?`<span class="small muted">${t('{n} days ago',{n:fi.days})} · ${fi.score}/5</span>`:''}</div>
   ${photosOf(aid,sid,'SNAP').map(p=>`<div class="thumb" style="display:inline-block;margin:0 6px 10px 0" data-act="viewPhoto" data-id="${p.id}"><img src="${PH.get(p.id)}" alt=""></div>`).join('')}
   ${rows.map(({q,r})=>`<div class="q" style="margin-bottom:8px"><div class="row between" style="flex-wrap:nowrap"><div><span class="cat">${catn(q.cat)}</span>${esc(qText(q,a))}</div>${chip(r.s)}</div>${r.r?`<div class="small muted mt">“${esc(r.r)}”</div>`:''}
    <div class="thumbs">${photosOf(aid,sid,q.id).map(p=>`<div class="thumb" data-act="viewPhoto" data-id="${p.id}"><img src="${PH.get(p.id)}" alt=""></div>`).join('')}</div></div>`).join('')}
   ${(a.note||{})[sid]?`<p class="small"><b>${t('Notes')}:</b> ${esc(a.note[sid])}</p>`:''}`,null,true);
}

  return{id:uid('ACT'),store:a.store,audit:a.id,sec:sec.id,secName:sec.name,cat:q.cat,issue:(r.r&&r.r.trim())?r.r.trim():`${qText(q,a,true)} – scored ${r.s}/5`,owner:'',due:addDays(a.date,r.s===1?3:7),priority:r.s===1?'High':'Medium',status:'Open',created:a.date,closed:'',closeNote:''}}
function submitAudit(){
  const a=curAudit();
  for(const sid of a.scope){if(!secProgress(a,sid).complete)return toast(t('Complete every section (answers, required photos, snapshot and last-change date) to submit.'),true)}
  a.status='Submitted';a.time=a.time||nowT();let n=0;
  a.scope.forEach(sid=>{const sec=secById(sid),R=a.resp[sid]||{};
    for(const qid in R){const q=qById(qid),r=R[qid];if(q&&r.s>0&&r.s<=S.set.actionMax){S.actions.push(newActionFromResp(a,sec,q,r));n++}}
    const fi=freshInfo(sec.freq,a.chg[sid],a.date);
    if(fi.score&&fi.score<=S.set.actionMax){S.actions.push({id:uid('ACT'),store:a.store,audit:a.id,sec:sid,secName:sec.name,cat:'Freshness',issue:`Display not changed for ${fi.days} days (every ${sec.freq} days expected) – refresh display to the current theme`,owner:'',due:addDays(a.date,7),priority:'Medium',status:'Open',created:a.date,closed:'',closeNote:''});n++}
    if(a.chg[sid]&&(!sec.lastChange||a.chg[sid]>=sec.lastChange)){sec.lastChange=a.chg[sid];sec.history=sec.history||[];if(!sec.history.some(h=>h.date===a.chg[sid]))sec.history.push({date:a.chg[sid],theme:(themeById(a.themeId)||{}).name,by:a.auditor+' (audit)'})}});
  log('audit_submitted',`${a.id} score ${r2(analyze(a).overall)}`);save();
  U.sumId=a.id;U.view='summary';U.anim=true;toast(n?`${t('Submitted ✓')} · ${n} ${t('Actions').toLowerCase()}`:t('Submitted ✓'));render()}

  exportCSV(el){const v=el.dataset.v;let rows;const stn=id=>(storeOf(id).short||storeOf(id).name),rl=repAudits();
    if(v==='audits')rows=[['AuditID','Store','Date','Time','UserID','AuditorName','Month','ThemeID','OverallScore(/5)','OverallScore(%)','Status']].concat(rl.map(a=>{const o=analyze(a).overall;return[a.id,stn(a.store),a.date,a.time,a.user,a.auditor,a.month,a.themeId,o==null?'':r2(o),o==null?'':Math.round(o/5*100),a.status]}));
    else if(v==='responses'){rows=[['AuditID','Store','Date','SectionID','Section','QuestionID','Category','Question','Score(1-5)','Answer','Remark','Photos','Timestamp']];rl.forEach(a=>{for(const sid in a.resp)for(const qid in a.resp[sid]){const r=a.resp[sid][qid],q=qById(qid);rows.push([a.id,stn(a.store),a.date,sid,(secById(sid)||{}).name,qid,q?q.cat:'',q?qText(q,a,true):'',r.s===0?'N/A':r.s,r.s===0?'N/A':r.s>=4?'OK':'Needs Attention',r.r||'',photosOf(a.id,sid,qid).length,r.t||''])}})}
    else if(v==='actions')rows=[['ActionID','Store','AuditID','Section','Category','Issue','Owner','Due','Priority','Status','Closed','Closure note']].concat(S.actions.filter(x=>x.store===curStore().id).map(x=>[x.id,stn(x.store),x.audit,x.secName,x.cat,x.issue,x.owner,x.due,x.priority,x.status,x.closed,x.closeNote]));
    else rows=[['Store','Section','Floor','Type','FrequencyDays','LastChanged','DaysSince','NextDue','Status']].concat(activeSections().map(s=>{const i=freshInfo(s.freq,s.lastChange,today());return[stn(s.store),s.name,s.floor,typeLabel(s.type),s.freq,s.lastChange,i.days??'',i.next||'',FRESH_PILL[i.state][2]]}));
    download('VM_'+v+'_'+today()+'.csv',csv(rows))},
  demo(){if(S.audits.some(a=>a.demo&&a.store===curStore().id)&&!confirm('Demo audits already exist for this store. Add another set?'))return;makeDemo();save();toast('Demo audits loaded');U.view='dashboard';U.anim=true;render()},
  resetAll(){if(!confirm('Reset ALL data (stores, audits, photos, config) to the template defaults?'))return;PH.cache.forEach((v,k)=>PH.del(k));localStorage.removeItem(Store.key);seed().then(s=>{S=s;save();U.user=null;U.store=S.stores[0].id;sessionStorage.removeItem('svv_vm_user');render()})},
};
for(const k of ['addFloor','editFloor','addSection','editSection','addTheme','editTheme','addQ','editQ','addUser','editUser','addStore','editStore'])A[k]=el=>MODALS[k](el.dataset.id);

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('#loginForm')){e.preventDefault();A.login()}if(e.key==='Escape')closeModal()});
document.addEventListener('input',e=>{if(e.target.closest('#mform')&&modal.upd&&$('#bp'))modal.upd()});
document.addEventListener('change',async e=>{const el=e.target;if(!el.dataset||!el.dataset.change)return;const c=el.dataset.change,a=curAudit();
  if(c==='dashAudit'){U.dashAudit=el.value;U.anim=true;render()}
  else if(c==='switchStore')setStore(el.value);
  else if(c==='repFrom'){U.rep.from=el.value;U.rep.preset='custom';render()}
  else if(c==='repTo'){U.rep.to=el.value;U.rep.preset='custom';render()}
  else if(c==='repStore'){U.rep.store=el.value;render()}
  else if(c==='repStatus'){U.rep.status=el.value;render()}
  else if(c==='chg'){a.chg[U.secId]=el.value;save();render()}
  else if(c==='secNote'){a.note=a.note||{};a.note[U.secId]=el.value;save()}
  else if(c==='remark'){a.resp[U.secId][el.dataset.q].r=el.value;save()}
  else if(c==='photo'){const files=[...el.files];if(!files.length)return;
    try{for(const f of files){const d=await compress(f);const id=uid('PHOTO');PH.put(id,d);S.photos.push({id,audit:a.id,sec:el.dataset.sid,q:el.dataset.q,ts:new Date().toISOString()})}save();render()}catch(err){toast('Could not read that image',true)}}
  else if(c==='importJSON'){const f=el.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.S||!j.S.sections)throw 0;if(!confirm('Replace current data with this backup?'))return;PH.cache.forEach((v,k)=>PH.del(k));S=j.S;for(const k in j.photos||{})PH.put(k,j.photos[k]);if(!S.v||S.v<2)migrate();save();U.user=null;U.store=S.stores[0].id;sessionStorage.removeItem('svv_vm_user');render();toast('Backup restored')}catch(err){toast('Not a valid backup file',true)}}
});
const tip=$('#tip');
document.addEventListener('mouseover',e=>{const x=e.target.closest('[data-tip]');if(!x){tip.style.display='none';return}tip.textContent=x.dataset.tip;tip.style.display='block'});
document.addEventListener('mousemove',e=>{if(tip.style.display==='block'){tip.style.left=Math.min(e.clientX+12,innerWidth-270)+'px';tip.style.top=(e.clientY+14)+'px'}});

/* ---------- demo data generator (for the active store) ---------- */
function makeDemo(){
  const secs=activeSections(),tdy=today(),st=curStore().id;
  const cv=document.createElement('canvas');cv.width=240;cv.height=160;const cx=cv.getContext('2d');
  const g=cx.createLinearGradient(0,0,240,160);g.addColorStop(0,'#530001');g.addColorStop(1,'#c8942a');cx.fillStyle=g;cx.fillRect(0,0,240,160);
  cx.fillStyle='#fdf8f0cc';cx.font='bold 15px sans-serif';cx.fillText('DEMO PHOTO',66,86);const demoImg=cv.toDataURL('image/jpeg',.6);
  let seedv=7;const rnd=()=>(seedv=(seedv*9301+49297)%233280)/233280;
  const plan=[[8,3.45],[9,3.75],[10,3.95],[11,4.15]],yr=new Date().getFullYear(),audUser=(S.users.find(u=>u.role==='Auditor')||U.user);
  plan.forEach(([m,mean],ix)=>{
    const date=m===new Date().getMonth()+1?tdy:fmtD(new Date(yr,m-1,12)),th=themeFor(m,yr);
    const a={id:uid('AUD'),store:st,date,time:'10:30',user:audUser.id,auditor:audUser.name,month:m,themeId:th?th.id:S.themes[0].id,status:'Submitted',scope:secs.map(s=>s.id),resp:{},chg:{},note:{},demo:true};
    secs.forEach(s=>{a.resp[s.id]={};
      const bias=(s.type==='Power Wall'?-.2:s.type==='Entry'?.15:0)+(s.floor==='FF'?-.2:0);
      questionsFor(s.type).forEach(q=>{
        let v=mean+bias+(q.cat==='Theme'?(ix<2?-.5:-.15):0)+(q.cat==='Lighting'?-.2:0)+(rnd()-.5)*1.7;
        v=Math.max(1,Math.min(5,Math.round(v)));a.resp[s.id][q.id]={s:v,r:v<=3?'Needs attention – see photo':'',t:date+'T10:40:00Z'};
        if(q.photo==='Y'||rnd()>.8){const id=uid('PHOTO');PH.put(id,demoImg);S.photos.push({id,audit:a.id,sec:s.id,q:q.id,ts:date})}});
      const days=Math.round(s.freq*(.35+rnd()*(ix===3?1.7:1.2)));a.chg[s.id]=addDays(date,-days);
      const id=uid('PHOTO');PH.put(id,demoImg);S.photos.push({id,audit:a.id,sec:s.id,q:'SNAP',ts:date})});
    S.audits.push(a);
    if(ix===3){secs.forEach(s=>{s.lastChange=a.chg[s.id];s.history=[{date:a.chg[s.id],theme:th?th.name:'',by:audUser.name+' (audit)'}]});
      a.scope.forEach(sid=>{const sec=secById(sid),R=a.resp[sid];for(const qid in R){const q=qById(qid),r=R[qid];if(r.s<=S.set.actionMax)S.actions.push(newActionFromResp(a,sec,q,r))}})}
  });
}
